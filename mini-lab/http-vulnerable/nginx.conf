server {
    listen 80;
    server_name _;

    # All other paths require HTTP Basic Auth.
    # auth_basic_user_file points to the htpasswd file built into the image.
    # Brutus --protocol http makes GET / with Authorization: Basic <creds>:
    #   - No credentials / wrong credentials → 401 Unauthorized
    #   - Valid credentials                  → 200 OK (serves index.html)
    location / {
        auth_basic "Grafana";
        auth_basic_user_file /etc/nginx/.htpasswd;
        root /usr/share/nginx/html;
        index index.html;
    }
}
