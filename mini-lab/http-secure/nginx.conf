server {
    listen 80;
    server_name _;

    # All other paths require HTTP Basic Auth.
    # Strong password is not in the wordlist — Brutus will exhaust the list
    # without finding valid credentials, demonstrating the value of strong passwords.
    location / {
        auth_basic "Grafana";
        auth_basic_user_file /etc/nginx/.htpasswd;
        root /usr/share/nginx/html;
        index index.html;
    }
}
